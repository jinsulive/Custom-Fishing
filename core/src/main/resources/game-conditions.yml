# ==============================================================================
#            CustomFishing 钓鱼小游戏触发条件配置 (Game Conditions)
#  将不同的搏斗机制 (精准点击/张力控制/急速收线/音游律动/长按跟随) 分配给不同生境鱼类
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 传说与神话鱼类专属巅峰挑战
# ------------------------------------------------------------------------------
rainbow_fish_games:
  conditions:
    loot:
      - rainbow_fish
  list:
    - rainbow_1:+1
    - rainbow_2:+1
    - rainbow_3:+1
    - rainbow_4:+1
    - rainbow_5:+1
    - rainbow_6:+1
    - rainbow_7:+1

leviathan_boss_games:
  conditions:
    loot:
      - leviathan_young
      - leviathan_young_silver_star
      - leviathan_young_golden_star
  list:
    - tension_game_hard:+25
    - click_game_hard:+15

singularity_mythic_games:
  conditions:
    loot:
      - singularity_fish
      - singularity_fish_silver_star
      - singularity_fish_golden_star
  list:
    - dance_game_hard:+30

celestial_koi_games:
  conditions:
    loot:
      - celestial_koi
      - celestial_koi_silver_star
      - celestial_koi_golden_star
  list:
    - dance_game_normal:+20
    - dance_game_hard:+10

# ------------------------------------------------------------------------------
# 2. 虚空维度小游戏 (Void Fishing - 节奏音游与虚空漫步)
# ------------------------------------------------------------------------------
void_games:
  conditions:
    in-void: true
    "!group":
      - special_game
  list:
    - dance_game_easy:+15
    - dance_game_normal:+8
    - hold_game_normal:+5
  sub-groups:
    silver:
      conditions:
        group:
          - silver_star
      list:
        - dance_game_easy:-10
        - dance_game_normal:+15
        - dance_game_hard:+6
    golden:
      conditions:
        group:
          - golden_star
      list:
        - dance_game_easy:-15
        - dance_game_normal:-3
        - dance_game_hard:+15

# ------------------------------------------------------------------------------
# 3. 熔岩生态小游戏 (Lava Fishing - 耐热耐力蓄力与狂暴点击)
# ------------------------------------------------------------------------------
lava_games:
  conditions:
    in-lava: true
    "!group":
      - special_game
  list:
    - hold_game_easy:+15
    - hold_game_normal:+6
    - click_game_easy:+8
  sub-groups:
    silver:
      conditions:
        group:
          - silver_star
      list:
        - hold_game_easy:-10
        - hold_game_normal:+12
        - hold_game_hard:+5
        - click_game_normal:+8
    golden:
      conditions:
        group:
          - golden_star
      list:
        - hold_game_easy:-15
        - hold_game_normal:-2
        - hold_game_hard:+10
        - click_game_hard:+10

# ------------------------------------------------------------------------------
# 4. 水域常规小游戏 (Water Fishing - 海洋张力与河流精准判定)
# ------------------------------------------------------------------------------
water_games:
  conditions:
    in-water: true
    "!group":
      - special_game
  list: []
  sub-groups:

    # 4.1 咸水海洋 (张力拔河与急速收线)
    ocean_games:
      conditions:
        biome:
          - minecraft:ocean
          - minecraft:deep_ocean
          - minecraft:cold_ocean
          - minecraft:deep_cold_ocean
          - minecraft:frozen_ocean
          - minecraft:deep_frozen_ocean
          - minecraft:lukewarm_ocean
          - minecraft:deep_lukewarm_ocean
          - minecraft:warm_ocean
      list:
        - tension_game_easy:+15
        - tension_game_normal:+6
        - click_game_easy:+8
      sub-groups:
        silver:
          conditions:
            group:
              - silver_star
          list:
            - tension_game_easy:-10
            - tension_game_normal:+12
            - tension_game_hard:+4
            - click_game_normal:+8
        golden:
          conditions:
            group:
              - golden_star
          list:
            - tension_game_easy:-15
            - tension_game_normal:-2
            - tension_game_hard:+9
            - click_game_hard:+9

    # 4.2 淡水河流与内陆水体 (精准时机点击与节奏旋律)
    river_games:
      conditions:
        '!biome':
          - minecraft:ocean
