# Note: These are the default configurations of the plugin
# and do not necessarily mean that players can have a good
# gaming experience. We hope that you will create
# customized configurations based on your own ideas,
# allowing players to experience the uniqueness of your server.

delicate_hook:
  material: SHEARS
  display:
    name: '<b><#1E90FF>精制钓钩'
    lore:
      - ''
      - '<#7FFFD4>描述:'
      - '<gray> - 凝聚精湛工艺与魅力的钓钩，绝非寻常钓具可比。'
      - '<gray> - 精心抛光雕琢，在水中闪耀微光，'
      - '<gray> - 能够不可抗拒地吸引高品质大鱼靠近。'
      - ''
      - '<#FFD700>特性:'
      - '<gray> - 提高获得高品质鱼类的概率'
  max-durability: 16
  custom-model-data: 50000
  # 封印附魔：由自研插件注册，id 必须与注册时的 NamespacedKey 一致
  enchantments:
    'minecraft:seal': 1
  # {dur} / {max}
  lore-on-rod:
    - ''
    - '<#7FFFAA>已装备鱼钩:'
    - '<gray> - 精制钓钩: 剩余 <white>{dur}</white> 次'
  effects:
    effect_1:
      type: group-mod
      value:
        - silver_star:+1
        - golden_star:+1

