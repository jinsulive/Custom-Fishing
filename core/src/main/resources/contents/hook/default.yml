      - '<gray> - 结构已极度脆弱，每一次穿入虚空都在消耗它的存在。'
      - ''
      - '<#FFD700>特性:'
      - '<gray> - 允许在虚空 (Void) 中垂钓'
      - '<gray> - 星云与紫颂系虚空生物吸引率提升'
      - '<gray> - 耐久极低，仅可支撑极少次数垂钓'
  max-durability: 12
  custom-model-data: 50604
  enchantments:
    'minecraft:seal': 1
  lore-on-rod:
    - ''
    - '<#7FFFAA>已装备鱼钩:'
    - '<gray> - 沉没虚空钓钩: <white>{dur}</white> 次剩余'
  effects:
    effect_1:
      type: void-fishing
    effect_2:
      type: group-mod
      value:
        - void:+4
        - nebula:+6
        - chorus:+6