# Note: These are the default configurations of the plugin
# and do not necessarily mean that players can have a good
# gaming experience. We hope that you will create
# customized configurations based on your own ideas,
# allowing players to experience the uniqueness of your server.

weekend_competition:
  # TOTAL_SCORE
  # CATCH_AMOUNT
  # MAX_SIZE
  # MIN_SIZE
  # TOTAL_SIZE
  # RANDOM
  goal: CATCH_AMOUNT

  # Optional
  # 1-7 (周日 = 7)
  start-weekday:
    - 7

  # Optional
  start-time:
    - '10:00'

  # Seconds (43200 = 12 小时，即 10:00 开始、22:00 结束)
  duration: 43200

  # Min players to start the competition
  min-players: 2
  skip-actions:
    broadcast:
      type: broadcast
      value:
        - '<red>[钓鱼竞赛]</red> 参与人数不足，本场周末钓鱼比赛已取消。'

  bossbar:
    enable: false # 关闭 BOSS 血条显示（12 小时长赛程会长时间遮挡视野）；如需恢复改为 true
    color: WHITE
    overlay: PROGRESS
    text:
      - '<gray>[<#87CEFA>🎣<gray>] <gradient:#F0F8FF:#87CEFA:#F0F8FF>剩余时间: <#E6E6FA>{hour}{minute}{second}</#E6E6FA> <gray>| <gradient:#F0F8FF:#87CEFA:#F0F8FF>当前排名: <#E6E6FA>#{rank}</#E6E6FA> <gray>| <gradient:#F0F8FF:#87CEFA:#F0F8FF>第一名: <#E6E6FA>{1_player}</#E6E6FA>'
      - '<gray>[<#87CEFA>🎣<gray>] <gradient:#F0F8FF:#87CEFA:#F0F8FF>剩余时间: <#E6E6FA>{hour}{minute}{second}</#E6E6FA> <gray>| <gradient:#F0F8FF:#87CEFA:#F0F8FF>当前得分: <#E6E6FA>{score_formatted}</#E6E6FA> <gray>| <gradient:#F0F8FF:#87CEFA:#F0F8FF>最高分: <#E6E6FA>{1_score}</#E6E6FA>'
      - '<gray>[<#87CEFA>🎣<gray>] <gradient:#F0F8FF:#87CEFA:#F0F8FF>剩余时间: <#E6E6FA>{hour}{minute}{second}</#E6E6FA> <gray>| <gradient:#F0F8FF:#87CEFA:#F0F8FF>获胜条件: <#E6E6FA>{goal}</#E6E6FA>'
    refresh-rate: 20 # in ticks
    switch-interval: 200 # in ticks
    only-show-to-participants: true

  actionbar:
    enable: false
    text:
      - '<gradient:#F0F8FF:#87CEFA:#F0F8FF>剩余时间: <#E6E6FA>{hour}{minute}{second}</#E6E6FA> <gray>| <gradient:#F0F8FF:#87CEFA:#F0F8FF>当前排名: <#E6E6FA>#{rank}</#E6E6FA> <gray>| <gradient:#F0F8FF:#87CEFA:#F0F8FF>第一名: <#E6E6FA>{1_player}</#E6E6FA>'
      - '<gradient:#F0F8FF:#87CEFA:#F0F8FF>剩余时间: <#E6E6FA>{hour}{minute}{second}</#E6E6FA> <gray>| <gradient:#F0F8FF:#87CEFA:#F0F8FF>当前得分: <#E6E6FA>{score_formatted}</#E6E6FA> <gray>| <gradient:#F0F8FF:#87CEFA:#F0F8FF>最高分: <#E6E6FA>{1_score}</#E6E6FA>'
      - '<gradient:#F0F8FF:#87CEFA:#F0F8FF>剩余时间: <#E6E6FA>{hour}{minute}{second}</#E6E6FA> <gray>| <gradient:#F0F8FF:#87CEFA:#F0F8FF>获胜条件: <#E6E6FA>{goal}</#E6E6FA>'
    refresh-rate: 5 # in ticks
    switch-interval: 200 # in ticks
    only-show-to-participants: true

  # timely broadcast competition
  # 定期排行榜广播：BOSS 血条关闭后，用它承担「倒计时 + 榜单」的信息输出。
  # 广播会发给全服在线玩家（实现里固定遍历 Bukkit.getOnlinePlayers()），
  # 12 小时赛程 × 30 分钟一次 = 24 次/天，兼顾可见度与聊天框负担。
  broadcast:
    enable: true
    text:
      - '<#D4F2E7>◤─────────────────────────◥'
      - ''
      - '             <gray>[<#87CEFA>🎣<gray>]  <gradient:#F0F8FF:#87CEFA:#F0F8FF>周末钓鱼大赛'
      - ''
      - '     <#E1FFFF>当前排行榜:</#E1FFFF>'
      - '              <#E1FFFF>No.①: {1_player} - {1_score}'
      - '              <#E1FFFF>No.②: {2_player} - {2_score}'
      - '              <#E1FFFF>No.③: {3_player} - {3_score}'
      - ''
      - '              <#B0C4DE>剩余时间: {hour}{minute}{second}'
      - ''
      - '<#D4F2E7>◣─────────────────────────◢'
    interval: 36000 # in ticks (30 分钟)

  start-actions:
    broadcast:
      type: broadcast
      value:
        - '<#D4F2E7>◤─────────────────────────◥'
        - ''
        - '             <gray>[<#87CEFA>🎣<gray>]  <gradient:#F0F8FF:#87CEFA:#F0F8FF><b>周末钓鱼大赛</b></gradient>'
        - ''
        - '      <#E1FFFF>获胜目标:'
        - '         <#B0C4DE>{goal}'
        - '           <#B0C4DE>甩起鱼竿即可参与竞逐！'
        - ''
        - '<#D4F2E7>◣─────────────────────────◢'
  end-actions:
    broadcast:
      type: broadcast
      value:
        - '<#D4F2E7>◤─────────────────────────◥'
        - ''
        - '             <gray>[<#87CEFA>🎣<gray>]  <gradient:#F0F8FF:#87CEFA:#F0F8FF><b>周末钓鱼大赛 颁奖</b></gradient>'
        - ''
        - '      <#E1FFFF>比赛结果:'
        - '              <gradient:#FFF8DC:#FFD700:#FFF8DC>No.①: {1_player} - {1_score}'
        - '              <gradient:#F5FFFA:#F5F5F5:#F5FFFA>No.②: {2_player} - {2_score}'
        - '              <gradient:#D2B48C:#CD853F:#D2B48C>No.③: {3_player} - {3_score}'
        - ''
        - '<#D4F2E7>◣─────────────────────────◢'
  participate-actions:
    message:
      type: message
      value:
        - '<#87CEFA>[钓鱼大赛]</#87CEFA> <gray>你已加入周末钓鱼大赛，祝你好运！'

  # Requirements for participating the competition
  participate-requirements: {}

  # Rewards
  # 名次档位固定为 1 / 2 / 3 / participation 四个子键，不可增删：
  # Competition.java 以 `if (i < rewardsMap.size())` 判定档位，子键数量一变就会奖励错档。
  # 同一档位可挂多个动作，ActionManager.trigger 按数组全部执行（不是随机取一个）。
  rewards:
    1:
      command_action:
        type: command
        value:
          - 'money give {player} 515'
      # 冠军额外奖励：鲸元券 ×3（商业街抽奖凭证，非钓具）
      coupon_action:
        type: give-item
        value:
          item: 'CustomFishing:whale_coupon'
          amount: 3
          to-inventory: true
      messages_action:
        type: message
        value:
          - '<#FFD700>【冠军】恭喜荣获第一名！奖励 515 憨币 + 鲸元券 ×3！'
    2:
      command_action:
        type: command
        value:
          - 'money give {player} 255'
      # 亚军额外奖励：鲸元券 ×2
      coupon_action:
        type: give-item
        value:
          item: 'CustomFishing:whale_coupon'
          amount: 2
          to-inventory: true
      messages_action:
        type: message
        value:
          - '<#E0FFFF>【亚军】恭喜荣获第二名！奖励 255 憨币 + 鲸元券 ×2！'
    3:
      command_action:
        type: command
        value:
          - 'money give {player} 155'
      # 季军额外奖励：鲸元券 ×1
      coupon_action:
        type: give-item
        value:
          item: 'CustomFishing:whale_coupon'
          amount: 1
          to-inventory: true
      messages_action:
        type: message
        value:
          - '<#FFA500>【季军】恭喜荣获第三名！奖励 155 憨币 + 鲸元券 ×1！'
    # 第 4 名及以后不再发奖。
    # 注意：Competition.java 用 `if (i < rewardsMap.size())` 判定名次档位，
    # 本表子键数量必须为 4（1/2/3 + 本键），否则第 3 名会被归入"参与奖"分支而拿不到 155。
    # 因此保留此键，用 chance: 0 让它永不触发。
    participation:
      no_reward:
        type: message
        chance: 0
        value:
          - ''

# 海王巨物杯 (周一至周六，比拼单条鱼的最大体长)
daily_max_size_derby:
  goal: MAX_SIZE
  start-weekday:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
  start-time:
    - '10:00'
  # Seconds (43200 = 12 小时，即 10:00 开始、22:00 结束)
  duration: 43200
  min-players: 1
  bossbar:
    enable: false # 关闭 BOSS 血条显示（如需恢复改为 true）
    color: BLUE
    overlay: PROGRESS
    text:
      - '<gray>[<#00FFFF>🦈<gray>] <gradient:#00BFFF:#1E90FF>海王巨物赛 <gray>| <white>倒计时: <#FFD700>{hour}{minute}{second}</#FFD700> <gray>| <white>榜首: <#7FFFD4>{1_player} ({1_score}cm)</#7FFFD4>'
      - '<gray>[<#00FFFF>🦈<gray>] <gradient:#00BFFF:#1E90FF>海王巨物赛 <gray>| <white>你的排名: <#FFA500>#{rank}</#FFA500> <gray>| <white>个人纪录: <#E6E6FA>{score_formatted}cm</#E6E6FA>'
    refresh-rate: 20
    switch-interval: 160
    only-show-to-participants: true
  # 定期排行榜广播（BOSS 血条关闭后的信息出口），30 分钟一次
  broadcast:
    enable: true
    text:
      - '<#00BFFF>◤──────────────────────────────────────◥'
      - ''
      - '       <gray>[<#00FFFF>🦈<gray>]  <gradient:#00BFFF:#1E90FF>【每日海王巨物争霸赛 实时榜单】'
      - ''
      - '      <#E1FFFF>No.①: {1_player} - {1_score}cm'
      - '      <#E1FFFF>No.②: {2_player} - {2_score}cm'
      - '      <#E1FFFF>No.③: {3_player} - {3_score}cm'
      - ''
      - '      <#B0C4DE>剩余时间: {hour}{minute}{second}'
      - ''
      - '<#00BFFF>◣──────────────────────────────────────◢'
    interval: 36000 # in ticks (30 分钟)
  start-actions:
    broadcast:
      type: broadcast
      value:
        - '<#00BFFF>◤──────────────────────────────────────◥'
        - ''
        - '       <gray>[<#00FFFF>🦈<gray>]  <gradient:#00BFFF:#1E90FF:#00BFFF><b>【每日海王巨物争霸赛】</b></gradient>'
        - ''
        - '    <#E1FFFF>获胜目标: <#FFD700>捕获单条体长最长的巨鱼！'
        - '    <#E1FFFF>带上你的大体长钓竿与诱饵，出海猎巨物吧！'
        - ''
        - '<#00BFFF>◣──────────────────────────────────────◢'
  end-actions:
    broadcast:
      type: broadcast
      value:
        - '<#00BFFF>◤──────────────────────────────────────◥'
        - ''
        - '       <gray>[<#00FFFF>🦈<gray>]  <gradient:#00BFFF:#1E90FF:#00BFFF><b>【海王巨物争霸赛 颁奖典礼】</b></gradient>'
        - ''
        - '      <gradient:#FFF8DC:#FFD700:#FFF8DC>冠 军: {1_player} - 体长: {1_score}cm'
        - '      <gradient:#F5FFFA:#F5F5F5:#F5FFFA>亚 军: {2_player} - 体长: {2_score}cm'
        - '      <gradient:#D2B48C:#CD853F:#D2B48C>季 军: {3_player} - 体长: {3_score}cm'
        - ''
        - '<#00BFFF>◣──────────────────────────────────────◢'
  participate-actions:
    message:
      type: message
      value:
        - '<#00BFFF>[海王争霸]</#00BFFF> <gray>你已加入海王巨物争霸赛，祝你钓起绝世海怪！'
  rewards:
    1:
      command_action:
        type: command
        value:
          - 'money give {player} 515'
      messages_action:
        type: message
        value:
          - '<#FFD700>【巨物霸主】恭喜你夺得第一名！获得 515 憨币与海王殊荣！'
    2:
      command_action:
        type: command
        value:
          - 'money give {player} 255'
      messages_action:
        type: message
        value:
          - '<#E0FFFF>【屈居第二】恭喜获得亚军！获得 255 憨币！'
    3:
      command_action:
        type: command
        value:
          - 'money give {player} 155'
      messages_action:
        type: message
        value:
          - '<#FFA500>【登上领奖台】恭喜获得季军！获得 155 憨币！'
    # 第 4 名及以后不再发奖。
    # 注意：Competition.java 用 `if (i < rewardsMap.size())` 判定名次档位，
    # 本表子键数量必须为 4（1/2/3 + 本键），否则第 3 名会被归入"参与奖"分支而拿不到 155。
    # 因此保留此键，用 chance: 0 让它永不触发。
    participation:
      no_reward:
        type: message
        chance: 0
        value:
          - ''