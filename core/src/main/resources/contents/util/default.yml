# and do not necessarily mean that players can have a good
# gaming experience. We hope that you will create
# customized configurations based on your own ideas,
# allowing players to experience the uniqueness of your server.

fishfinder:
  material: PAPER
  display:
    name: '<b><#1E90FF>探鱼雷达仪'
    lore:
      - ''
      - '<#7FFFD4>描述:'
      - '<gray> - 小巧而功能强劲的水下声呐探测仪，'
      - '<gray> - 能精准扫描当前水体，探测水面下方潜藏的鱼类物种。'
      - '<gray> - 无论在未知秘境还是熟悉水域，都能为你提供水产图鉴情报。'
      - ''
  custom-model-data: 50000
  events:
    interact:
      conditional_action:
        type: conditional
        value:
          conditions:
            condition_1:
              type: cooldown
              value:
                key: fishfinder
                time: 3000
              not-met-actions:
                action_1:
                  type: message
                  value:
                    - '<red>请稍候！使用探鱼雷达仪过于频繁（冷却 3 秒）。</red>'
          actions:
            action_1:
              type: fish-finder
              value:
                surrounding: water
                ignore-gears: true
water_effect:
  material: PAPER
  custom-model-data: 49998
lava_effect:
  material: PAPER
  custom-model-data: 49999