# ==============================================================================
#                      特殊战利品箱 (Treasure Crates / 可携带版)
#   这些箱子原本是 BLOCK 型战利品（钓上来后化作下落的木桶方块，需玩家去砸），
#   现改为 ITEM 型：钓中后凭 to-inventory: true 直接进玩家背包，
#   手持右键即可开启，避免木桶在熔岩海被烧毁、在水里漂走或被他人抢走。
#
#   ⚠ 关键点
#   1. to-inventory: true 必须写在配置顶层（loot 级函数），这是"直接进背包"的开关。
#      该函数仅对 ITEM / ENTITY 型生效；BLOCK 型的分发逻辑是硬编码召唤 FallingBlock，
#      写在这里也无效（见 CustomFishingHook.java 的 case BLOCK 分支）。
#   2. 箱内奖励用 give-item 动作发放，自定义物品必须写成 CustomFishing:<物品ID>，
#      原版物品写大写 Material 名（如 DIAMOND）；to-inventory 同样要设为 true。
#   3. 每种奖励各自独立判定 chance，可能出现"空箱"，也可能一次开出多件。
#   4. 最后一个动作 item-amount: -1 用于消耗自身，漏写会导致无限开箱。
# ==============================================================================

# 精制钓具箱：通用钓具补给（鱼钩 + 诱饵），浅水特殊钓竿即可获得
tackle_crate:
  material: BARREL
  nick: <gradient:#D2B48C:#8B4513>精制钓具箱</gradient>
  display:
    name: <gradient:#D2B48C:#8B4513><b>精制钓具箱</b></gradient>
    lore:
      - ''
      - '<#7FFFD4>描述:'
      - '<gray> - 用加固木条与铜钉封装的钓具箱，箱盖上烙着旧渔会的印记。'
      - '<gray> - 摇晃时能听见鱼钩碰撞与饵料袋摩擦的细碎声响。'
      - ''
      - '<#FFD700>特性:'
      - '<gray> - 右键开启：随机获得精制鱼钩 / 诱饵 / 诱鱼剂'
      - '<gray> - 小概率开出稀有鱼竿（虚空 / 炽焰）'
      - '<gray> - 每件物品独立判定，可能开出多件，也可能空手'
      - ''
      - '<#FFAA00>右键点击即可开启'
  custom-model-data: 50605
  show-in-fishfinder: false
  disable-stat: true
  to-inventory: true
  price:
    base: 200
  events:
    interact:
      reward_hook_delicate:
        type: give-item
        chance: 0.3
        value:
          item: 'CustomFishing:delicate_hook'
          amount: 1
          to-inventory: true
      reward_hook_feather:
        type: give-item
        chance: 0.25
        value:
          item: 'CustomFishing:feather_hook'
          amount: 1
          to-inventory: true
      reward_hook_magnetic_gold:
        type: give-item
        chance: 0.18
        value:
          item: 'CustomFishing:magnetic_gold_hook'
          amount: 1
          to-inventory: true
      reward_bait_simple:
        type: give-item
        chance: 0.45
        value:
          item: 'CustomFishing:simple_bait'
          amount: 2~4
          to-inventory: true
      reward_bait_magnetic:
        type: give-item
        chance: 0.35
        value:
          item: 'CustomFishing:magnetic_bait'
          amount: 1~2
          to-inventory: true
      reward_chum_storm:
        type: give-item
        chance: 0.2
        value:
          item: 'CustomFishing:storm_chum'
          amount: 1~2
          to-inventory: true
      # 荒野狂暴诱饵：获取途径与磁力诱饵完全一致（精制钓具箱 35% / 秘法鱼饵袋 40%）
      reward_bait_wild:
        type: give-item
        chance: 0.35
        value:
          item: 'CustomFishing:wild_bait'
          amount: 1~2
          to-inventory: true
      # ---- 稀有鱼竿：各自独立判定 5%（虚空 / 炽焰，两根合计约 9.75% 至少出一根）----
      reward_rod_void:
        type: give-item
        chance: 0.05
        value:
          item: 'CustomFishing:void_rod'
          amount: 1
          to-inventory: true
      reward_rod_infernal:
        type: give-item
        chance: 0.05
        value:
          item: 'CustomFishing:infernal_rod'
          amount: 1
          to-inventory: true
      consume_self:
        type: item-amount
        value: -1
      open_sound:
        type: sound
        value:
          key: minecraft:block.barrel.open
          source: block
          volume: 0.9
          pitch: 1.0

