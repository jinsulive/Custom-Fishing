angler_helmet:
  material: IRON_HELMET
  display:
    name: "<b><#A0D2DB>垂钓者便帽</b>"
    lore:
      - ''
      - '<#7FFFD4>描述:'
      - '<gray> - 坚固透气的遮阳头盔，能让钓手在长时间垂钓时保持高度专注。'
      - ''
      - '<#FFD700>特性:'
      - '<gray> - 略微降低钓鱼难度 (-4)'
  custom-model-data: 50010
  effects:
    effect_1:
      type: difficulty
      value: -4

deep_sea_chestplate:
  material: DIAMOND_CHESTPLATE
  display:
    name: "<b><#3A6EA5>深海重装胸甲</b>"
    lore:
      - ''
      - '<#7FFFD4>描述:'
      - '<gray> - 强化加固的深海抗压胸甲，厚重沉稳，更容易引来大体型巨鱼。'
      - ''
      - '<#FFD700>特性:'
      - '<gray> - 深海垂钓（Y < 30）时，白银之星权重 +2'
  custom-model-data: 50011
  effects:
    effect_1:
      type: conditional
      conditions:
        in-water: true
        ypos:
          - -64~30
      effects:
        effect_1:
          type: group-mod
          value:
            - silver_star:+2

swift_leggings:
