        amount: 1~2
        chance: 0.35
      ender_pearl:
        item: ENDER_PEARL
        amount: 2~5
        chance: 0.45
      chorus_fruit:
        item: CHORUS_FRUIT
        amount: 2~6
        chance: 0.4
      popped_chorus_fruit:
        item: POPPED_CHORUS_FRUIT
        amount: 1~3
        chance: 0.25
      ender_eye:
        item: ENDER_EYE
        amount: 1
        chance: 0.1
      shulker_shell:
        item: SHULKER_SHELL
        amount: 1
        chance: 0.06
      dragon_breath:
