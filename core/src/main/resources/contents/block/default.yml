# 2026-10-20 调整：apple_crate / carrot_crate 保留定义，但不再进入任何战利品池
#   - loot-conditions.yml 中已删除两者的权重，因此不会自然钓出；
#   - 定义必须保留：空 YAML（root 为 null）会让 ConfigManager#loadData 的
#     YamlDocument.create 抛 ConstructorException，日志刷
#     "Could not load config file ... Is it a corrupted file?"；
#   - show-in-fishfinder: false + disable-stat: true，不进图鉴、不计入统计，
#     仅能通过 /customfishing items give apple_crate 这类指令直接获取。

apple_crate:
  show-in-fishfinder: false
  disable-stat: true
  nick: Apple Crate
  block: barrel
  velocity:
    horizontal: 1.07
    vertical: 1.5
  properties:
    directional-6: true
    storage:
