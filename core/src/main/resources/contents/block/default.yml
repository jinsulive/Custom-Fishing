# ==============================================================================
#                           特殊战利品箱 (Treasure Crates)
#   仅由特殊钓竿在特定环境中钓起，落水后化为可开启的容器方块，
#   箱内按 chance 独立判定抽取，可能存在空箱，也可能一次开出多件稀有物品。
#   注意：箱内若是本插件自定义物品，必须写成 CustomFishing:<物品ID>；
#         直接写物品 ID 会被当作原版材质解析并报错。
# ==============================================================================

# 精制钓具箱：通用钓具补给（鱼钩 + 诱饵），浅水特殊钓竿即可获得
tackle_crate:
  show-in-fishfinder: false
  disable-stat: true
  nick: '精制钓具箱'
  block: barrel
  velocity:
    horizontal: 1.07
    vertical: 1.5
  properties:
    directional-6: true
    storage:
      hook_delicate:
        item: 'CustomFishing:delicate_hook'
        amount: 1
        chance: 0.3
      hook_feather:
        item: 'CustomFishing:feather_hook'
        amount: 1
        chance: 0.25
      hook_magnetic_gold:
        item: 'CustomFishing:magnetic_gold_hook'
        amount: 1
        chance: 0.18
      bait_simple:
        item: 'CustomFishing:simple_bait'
        amount: 2~4
        chance: 0.45
      bait_magnetic:
        item: 'CustomFishing:magnetic_bait'
        amount: 1~2
        chance: 0.35
      chum_storm:
        item: 'CustomFishing:storm_chum'
        amount: 1~2
        chance: 0.2

# 深渊宝藏箱：深海海底 (Y < 30) 专属，产出深海钓钩与海洋珍贵素材
abyssal_treasure_chest:
  show-in-fishfinder: false
  disable-stat: true
  nick: '深渊宝藏箱'
  block: barrel
  velocity:
    horizontal: 1.05
    vertical: 1.35
  properties:
    directional-6: true
    storage:
      hook_abyssal:
        item: 'CustomFishing:abyssal_heavy_sink_hook'
        amount: 1
        chance: 0.22
      chum_bioluminescent:
        item: 'CustomFishing:bioluminescent_chum'
        amount: 1~2
        chance: 0.35
      diamond:
        item: DIAMOND
        amount: 1~3
        chance: 0.35
      gold_ingot:
        item: GOLD_INGOT
        amount: 2~5
        chance: 0.4
      prismarine_crystals:
        item: PRISMARINE_CRYSTALS
        amount: 2~6
        chance: 0.35
      nautilus_shell:
        item: NAUTILUS_SHELL
        amount: 1
        chance: 0.15
      heart_of_the_sea:
        item: HEART_OF_THE_SEA
        amount: 1
        chance: 0.03

# 炼狱保险箱：下界熔岩海专属，产出高温素材与下界稀有矿料
infernal_strongbox:
  show-in-fishfinder: false
  disable-stat: true
  nick: '炼狱保险箱'
  block: barrel
  velocity:
    horizontal: 1.02
    vertical: 1.3
  properties:
    directional-6: true
    storage:
      chum_magma:
        item: 'CustomFishing:magma_chum'
        amount: 1~2
        chance: 0.35
      # 沉没黑曜石钓钩：本版本 hook 不注册为 Loot，无法直接进权重表，
      # 因此以「箱内打捞物」的形式产出，作为熔岩池的低阶补偿钩
      hook_sunken_obsidian:
        item: 'CustomFishing:sunken_obsidian_hook'
        amount: 1
        chance: 0.28
      gold_ingot:
        item: GOLD_INGOT
        amount: 2~5
        chance: 0.4
      gold_nugget:
        item: GOLD_NUGGET
        amount: 4~12
        chance: 0.5
      blaze_powder:
        item: BLAZE_POWDER
        amount: 2~6
        chance: 0.4
      magma_cream:
        item: MAGMA_CREAM
        amount: 1~3
        chance: 0.3
      obsidian:
        item: OBSIDIAN
        amount: 2~5
        chance: 0.3
      ancient_debris:
        item: ANCIENT_DEBRIS
        amount: 1
        chance: 0.04

# 虚空遗物立方：末地与深层虚空专属，产出末地素材与空间类钓具
